[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "renewable-energy-forecasting"
version = "1.0.0"
description = "Probabilistic Wind and Solar Power Forecasting Platform"
authors = [{ name = "Paloma Bas Fernández", email = "palomabasfer@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "pytest>=7.0.0",
    "dash>=2.10.0",
    "plotly>=5.0.0",
    "pyyaml>=6.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
