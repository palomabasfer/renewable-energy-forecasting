baseline:
  seasonal_period: 24

arima:
  order: [2, 1, 1]
  seasonal_order: [1, 0, 1, 24]

xgboost:
  n_estimators: 150
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42

lightgbm:
  n_estimators: 150
  max_depth: 6
  learning_rate: 0.05
  num_leaves: 31
  random_state: 42

tft:
  hidden_dim: 64
  num_heads: 4
  learning_rate: 0.001
  batch_size: 32

chronos:
  model_size: "chronos-bolt-small"
  zero_shot: true

forecast_horizon: 24
quantiles: [0.1, 0.5, 0.9]
